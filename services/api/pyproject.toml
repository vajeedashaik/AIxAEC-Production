[project]
name = "aec-api"
version = "0.1.0"
description = "Public REST API: Clerk auth, Supabase DB + Storage, job queue + worker, versions, undo/redo, edit orchestration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aec-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "supabase>=2.10",
    "pyjwt[crypto]>=2.10",
    "pillow>=11",
    "pymupdf>=1.25",
    "boto3>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "moto[s3,sns,sqs]>=5",
]

[tool.uv]
package = false

[tool.uv.sources]
aec-contracts = { path = "../../packages/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf.*"]
follow_untyped_imports = false
ignore_missing_imports = true
follow_imports = "skip"
