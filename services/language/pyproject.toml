[project]
name = "aec-language"
version = "0.1.0"
description = "Rules + LLM (OmniRoute) command parser, room-label classification, local speech-to-text."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aec-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "av>=19.0.2",
    "openai>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.uv.sources]
aec-contracts = { path = "../../packages/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "slow: runs the real Whisper model; skipped unless it is already cached",
    "live: needs a running OmniRoute; run with -m live",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true
