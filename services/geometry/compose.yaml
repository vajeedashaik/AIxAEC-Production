services:
  geometry:
    build:
      context: ../..
      dockerfile: services/geometry/Dockerfile
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
    networks: [aec]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  aec:
    name: aec
